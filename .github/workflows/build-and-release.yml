name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add Pre-installed MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Toolchain
        run: |
          gcc --version
          g++ --version

      - name: Configure CMake
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build LitePostman
        run: |
          cmake --build build --config Release

      - name: Run Core Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Setup NSIS (Installer Creator)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create Windows Setup Installer (NSIS)
        shell: pwsh
        run: |
          if (-not (Test-Path "build/LitePostman.exe") -and (Test-Path "build/Release/LitePostman.exe")) {
            Copy-Item "build/Release/LitePostman.exe" -Destination "build/LitePostman.exe"
          }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis installer.nsi

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/LitePostman.exe -DestinationPath LitePostman-windows-x64.zip -Force

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LitePostman-Windows-Build
          path: |
            LitePostman-Setup.exe
            LitePostman-windows-x64.zip
            build/LitePostman.exe

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'LitePostman Latest Release' }}
          body: |
            ## LitePostman for Windows (x64)

            ### Downloads
            - **[LitePostman-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/LitePostman-Setup.exe)**: Complete Windows Installer with Start Menu & Desktop shortcuts
            - **[LitePostman-windows-x64.zip](https://github.com/${{ github.repository }}/releases/latest/download/LitePostman-windows-x64.zip)**: Standalone portable executable

            ### Key Features
            - Modern Postman-style UI with Dark & Light theme support
            - Full HTTP request CRUD operations (GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS)
            - Dynamic `{{variable}}` environment autocomplete popup menu
            - Pretty-printed JSON formatter & beautifier for request & response bodies
            - Environment and collection variable management
            - Postman v2.1 collection import/export and cURL clipboard integration
          draft: false
          prerelease: false
          make_latest: true
          files: |
            LitePostman-Setup.exe
            LitePostman-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
